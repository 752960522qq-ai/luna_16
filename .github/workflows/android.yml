name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rules checks
        run: |
          node tests/engine.test.js
          node tests/garage.test.cjs
          node tests/artillery-expansion.test.cjs
      - name: Model checks
        run: python3 tests/models.test.py
      - name: Native LAN and remote transport checks
        run: |
          javac -encoding UTF-8 -d /tmp/blindfire-tests app/src/main/java/com/luna/blindfire/LanLink.java app/src/main/java/com/luna/blindfire/RemoteHttp.java tests/LanLinkTest.java tests/RemoteHttpTest.java
          java -cp /tmp/blindfire-tests LanLinkTest
          node tests/native-remote.test.mjs
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: blindfire-v0.9-local-recon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Build infinite-currency test APK
        run: |
          gradle assembleDebug -PinfiniteCoins=true
          mkdir -p build/infinite-currency
          cp app/build/outputs/apk/debug/app-debug.apk build/infinite-currency/feigun-v0.9-infinite-coins.apk
      - uses: actions/upload-artifact@v4
        with:
          name: blindfire-v0.9-infinite-currency-test-apk
          path: build/infinite-currency/feigun-v0.9-infinite-coins.apk
          retention-days: 30
      - name: Build TapTap H5 upload package
        run: python3 scripts/build_h5.py --output build/blindfire-v0.9-taptap-h5.zip
      - uses: actions/upload-artifact@v4
        with:
          name: blindfire-v0.9-taptap-h5
          path: build/blindfire-v0.9-taptap-h5.zip
          retention-days: 30
