name: Build Android APK
on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rules checks
        run: |
          node tests/engine.test.js
          node tests/garage.test.cjs
          node tests/artillery-expansion.test.cjs
      - name: Model checks
        run: python3 tests/models.test.py
      - name: Native LAN and remote transport checks
        run: |
          javac -encoding UTF-8 -d /tmp/blindfire-tests app/src/main/java/com/luna/blindfire/LanLink.java app/src/main/java/com/luna/blindfire/RemoteHttp.java tests/LanLinkTest.java tests/RemoteHttpTest.java
          java -cp /tmp/blindfire-tests LanLinkTest
          node tests/native-remote.test.mjs
      - name: Rendered tread checks
        run: |
          node tests/renderer-air-support.test.mjs
          npm install --no-save playwright
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROMIUM_EXECUTABLE" ]; then
            npx playwright install --with-deps chromium
            unset CHROMIUM_EXECUTABLE
          fi
          SOFTWARE_GL=1 node tests/tread-webgl.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: blindfire-tread-render-validation
          path: test-output/treads/
          retention-days: 30
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: blindfire-v1.0-local-recon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - name: Build full-unlock test APK
        run: |
          gradle assembleDebug -PfullUnlockTest=true
          mkdir -p build/full-unlock-test
          cp app/build/outputs/apk/debug/app-debug.apk build/full-unlock-test/feigun-v1.0-full-unlock-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: blindfire-v1.0-full-unlock-test-apk
          path: build/full-unlock-test/feigun-v1.0-full-unlock-test.apk
          retention-days: 30
      - name: Build TapTap H5 upload package
        run: python3 scripts/build_h5.py --output build/blindfire-v1.0-taptap-h5.zip
      - name: Validate TapTap H5 and legacy saves
        run: |
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROMIUM_EXECUTABLE" ]; then unset CHROMIUM_EXECUTABLE; fi
          SOFTWARE_GL=1 node tests/h5-package.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: blindfire-h5-render-validation
          path: test-output/h5/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: blindfire-v1.0-taptap-h5
          path: build/blindfire-v1.0-taptap-h5.zip
          retention-days: 30
