plugins { id 'com.android.application' }
android {
    namespace 'com.luna.blindfire'
    compileSdk 35
    def infiniteCoins = project.findProperty('infiniteCoins')?.toString() == 'true'
    def fullUnlockTest = project.findProperty('fullUnlockTest')?.toString() == 'true'
    defaultConfig { applicationId (fullUnlockTest ? 'com.luna.blindfire.test' : infiniteCoins ? 'com.luna.blindfire.infinite' : 'com.luna.blindfire'); minSdk 23; targetSdk 35; versionCode 11; versionName (fullUnlockTest ? '0.9.1-full-unlock-test' : infiniteCoins ? '0.9.1-infinite' : '0.9.1'); buildConfigField 'boolean', 'FULL_UNLOCK_TEST', fullUnlockTest.toString(); buildConfigField 'boolean', 'INFINITE_COINS', infiniteCoins.toString() }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
