plugins { id 'com.android.application' }
android {
    namespace 'com.luna.blindfire'
    compileSdk 35
    def fullUnlockTest = project.findProperty('fullUnlockTest')?.toString() == 'true'
    defaultConfig { applicationId fullUnlockTest ? 'com.luna.blindfire.test' : 'com.luna.blindfire'; minSdk 23; targetSdk 35; versionCode 10; versionName fullUnlockTest ? '0.9-full-unlock-test' : '0.9'; buildConfigField 'boolean', 'FULL_UNLOCK_TEST', fullUnlockTest.toString() }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
