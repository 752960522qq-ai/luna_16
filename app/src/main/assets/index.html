<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101a19">
  <title>盲区交火</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="i-uav" viewBox="0 0 32 32"><path d="M16 7v18M7 16h18M10 10l12 12m0-12L10 22"/><circle cx="7" cy="7" r="4"/><circle cx="25" cy="7" r="4"/><circle cx="7" cy="25" r="4"/><circle cx="25" cy="25" r="4"/><path d="m12 12 4-3 4 3v8l-4 3-4-3Z"/></symbol>
  <symbol id="i-missile" viewBox="0 0 32 32"><path d="M11 21 25 7c2 7-2 12-10 18l-4-4Zm14-14 1-3-3 1M12 19l-7 1 6-7 8-1m-5 12-1 5 7-6 1-8M8 24l-4 4m7-2-3 3"/></symbol>
  <symbol id="i-artillery" viewBox="0 0 32 32"><path d="m9 19 13-14 4 4-13 14m-5-5 7 7M4 27h24M10 26l4-8 7 8M4 11q6-9 12-5"/><circle cx="7" cy="26" r="2"/><circle cx="24" cy="26" r="2"/></symbol>
  <symbol id="i-move" viewBox="0 0 32 32"><path d="M5 23h17l5-6H12l-4 6Zm2-2v-6h10l4 3M17 8h11m-4-4 4 4-4 4"/><circle cx="10" cy="26" r="2"/><circle cx="23" cy="24" r="2"/></symbol>
  <symbol id="i-decoy" viewBox="0 0 32 32"><path d="m16 8 8 15H8l8-15Zm0-4v-2M4 10l-2-2m28 0-2 2M5 27l-3 2m25-2 3 2M16 27v3"/><circle cx="16" cy="19" r="2"/></symbol>
  <symbol id="i-dive" viewBox="0 0 32 32"><path d="m8 5 14 17m-11 1 11-1 1-11M5 20l2 7 7 2m10-2 3-3"/></symbol>
  <symbol id="i-sam" viewBox="0 0 32 32"><path d="M5 25h20l-3 4H8l-3-4Zm6 0 5-8M13 19 23 5l4 4-10 14-4-4ZM7 6v8M3 10h8"/><circle cx="7" cy="10" r="6"/></symbol>
  <symbol id="i-mg" viewBox="0 0 32 32"><path d="M7 14h14l7-3v5l-7 2H7v-4Zm1 4-3 7h5l3-7m4 0 7 10M4 29h24M27 5h3m-1 4h2"/></symbol>
  <symbol id="i-sound" viewBox="0 0 32 32"><path d="M5 12h6l7-6v20l-7-6H5v-8Zm18-3q8 7 0 14m-1-10q3 3 0 6"/></symbol>
  <symbol id="i-pause" viewBox="0 0 32 32"><path d="M11 7v18M21 7v18"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 32 32"><path d="M5 16h22m-8-8 8 8-8 8"/></symbol>
  <symbol id="i-link" viewBox="0 0 32 32"><path d="m12 21-2 2a6 6 0 0 1-9-9l8-8a6 6 0 0 1 9 0m2 5 2-2a6 6 0 0 1 9 9l-8 8a6 6 0 0 1-9 0M11 21l10-10"/></symbol>
</defs></svg>
<main id="menu" class="screen menu">
  <canvas id="menuRadar" aria-hidden="true"></canvas>
  <div class="menu-top"><span class="eyebrow"><i></i> BLINDFIRE / 01</span><button class="icon-button sound-button" aria-label="开关声音"><svg><use href="#i-sound"/></svg></button></div>
  <div class="brand"><div class="brand-index">战 术 交 火 试 验</div><h1>盲区<br><span>交火</span><b>。</b></h1><p>每一次攻击<br>也是一条情报。</p></div>
  <div class="menu-bottom">
    <div class="difficulty"><span>单人难度</span><button data-difficulty="easy">新兵</button><button data-difficulty="standard" class="chosen">标准</button></div>
    <button id="startAI" class="start-button"><span><small>SOLO / OFFLINE</small>单人训练</span><svg><use href="#i-arrow"/></svg></button>
    <button id="openLAN" class="lan-button"><span><svg><use href="#i-link"/></svg>双人交火</span><small>同一 Wi-Fi / 热点</small></button>
    <div class="menu-foot"><button id="openGuide">作战指南 <span>↗</span></button><span>FIRST BUILD · v0.1</span></div>
  </div>
</main>
<main id="battle" class="screen battle hidden">
  <header class="battle-header"><div><span class="eyebrow" id="modeLabel">单人训练 / A</span><h2>盲区交火<span class="live-dot"></span></h2></div><div class="header-right"><span id="timer">03:00</span><button id="pauseButton" class="icon-button" aria-label="暂停"><svg><use href="#i-pause"/></svg></button></div></header>
  <div class="status-row"><div class="health"><span>发射车</span><div class="hp-track"><i id="hpBar"></i></div><b id="hpNumber">100</b></div><div id="intelBadge" class="intel-badge">敌情未知</div></div>
  <section class="map-section" aria-label="战术地图"><canvas id="map"></canvas><div class="map-top"><span id="sectorLabel">GRID / 8 × 12</span><span><i></i> NORTH ↑</span></div><div id="mapAlert" class="map-alert hidden"></div><div id="countdown" class="countdown hidden"></div><div id="toast" class="toast hidden"></div><div class="map-bottom"><span class="legend"><i></i> 我方 <i class="hostile"></i> 敌方线索</span><span id="scanCount">UAV / 0</span></div></section>
  <div id="eventLine" class="event-line"><i></i><span>行动开始：敌方位置未知</span></div>
  <footer class="controls">
    <div id="actionHint" class="action-hint">选择装备，然后点击地图</div>
    <div class="weapon-row">
      <button class="weapon selected" data-action="uav"><div><svg><use href="#i-uav"/></svg><span class="counter" id="uavCounter"></span></div><b>无人机</b><small>侦察 / 就绪</small><i class="cooldown"></i></button>
      <button class="weapon" data-action="missile"><div><svg><use href="#i-missile"/></svg></div><b>巡航导弹</b><small>精确 / 就绪</small><i class="cooldown"></i></button>
      <button class="weapon" data-action="artillery"><div><svg><use href="#i-artillery"/></svg></div><b>曲射火炮</b><small>区域 / 就绪</small><i class="cooldown"></i></button>
    </div>
    <div class="utility-row"><button data-action="move"><svg><use href="#i-move"/></svg><span>机动</span><small></small></button><button data-action="dive"><svg><use href="#i-dive"/></svg><span>无人机俯冲</span></button><button data-action="decoy"><svg><use href="#i-decoy"/></svg><span>诱饵</span><small></small></button></div>
    <div class="defense-row"><button id="samButton" data-action="sam"><svg><use href="#i-sam"/></svg><span>防空导弹</span><small>就绪</small></button><button id="mgButton"><svg><use href="#i-mg"/></svg><span>高射机枪</span><small>按住拦截</small></button></div>
  </footer>
</main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div id="modalCard" class="modal-card"></div></div>
<script src="engine.js"></script><script src="render.js"></script><script src="app.js"></script>
</body>
</html>
